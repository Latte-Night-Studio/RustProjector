[package]
name = "softprojector"
description = "Desktop projection application (SoftProjector Rust port)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "softprojector"
path = "src/main.rs"

[dependencies]
sp-core = { path = "../sp-core" }
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
rfd = "0.15"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_Graphics_Gdi"] }
